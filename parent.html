<title>خطة الأسبوع - مدرسة المروج</title>
<link rel="manifest" href="manifest-parent.json">
<meta name="theme-color" content="#0F2447">
<link rel="apple-touch-icon" href="icon-192.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --ink:#16233A;
    --navy:#1D3F73; --navy-dark:#0F2447;
    --purple:#5B4B9A; --purple-light:#EFEBFA;
    --teal:#1D8FA6; --teal-light:#E4F4F7;
    --sky:#3FB6DE;
    --green:#379969; --green-light:#E7F5EE;
    --navy-light:#E7EDF6;
    --sand:#F6F7F5; --slate:#667085; --white:#FFFFFF; --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    font-family:'IBM Plex Sans Arabic', sans-serif; margin:0; color:var(--ink);
    background:var(--sand); position:relative;
  }
  h1,h2,h3,h4{ font-family:'Tajawal', sans-serif; margin:0; }
  button{ border:none; border-radius:10px; font-family:inherit; cursor:pointer; }

  #bg-pattern{ position:fixed; inset:0; z-index:0; pointer-events:none; }
  #viewer-screen{ max-width:760px; margin:0 auto; padding:20px 16px 60px; position:relative; z-index:1; }

  .top-bar{
    background: linear-gradient(120deg, var(--navy-dark) 0%, var(--navy) 45%, var(--teal) 100%);
    border-radius:20px; padding:26px 24px; margin-bottom:20px; position:relative; overflow:hidden;
    display:flex; align-items:center; gap:16px; color:#fff;
  }
  .top-bar svg.hills{ position:absolute; bottom:-6px; right:-6px; left:-6px; opacity:0.5; z-index:0; }
  .top-bar img{ height:52px; background:#fff; border-radius:10px; padding:6px 8px; position:relative; z-index:1; }
  .top-bar .txt{ position:relative; z-index:1; }
  .top-bar h1{ font-size:19px; }
  .top-bar p{ font-size:13px; color:#DCEAF5; margin:4px 0 0; }

  .grade-tabs{ display:flex; gap:8px; background:#fff; border-radius:14px; padding:6px; margin-bottom:16px; border:1px solid #E7E5DD; }
  .grade-tab{
    flex:1; padding:11px 8px; text-align:center; border-radius:10px; font-size:13.5px; font-weight:500;
    color:var(--slate); background:transparent; transition:0.15s;
  }
  .grade-tab.active{ background:var(--navy); color:#fff; font-weight:700; }

  .week-nav{
    display:flex; align-items:center; justify-content:space-between; background:#fff; border-radius:14px;
    padding:10px 14px; border:1px solid #E7E5DD; margin-bottom:22px;
  }
  .week-nav button{ background:var(--navy-light); color:var(--navy); font-weight:700; padding:9px 16px; font-size:14px; display:flex; align-items:center; gap:4px; }
  .week-nav button:hover{ background:var(--purple-light); color:var(--purple); }
  .week-nav .center{ text-align:center; }
  .week-nav .center .label{ font-family:'Tajawal'; font-weight:800; font-size:16px; }
  .week-nav .center .sub{ font-size:11.5px; color:var(--slate); margin-top:1px; }

  #plans-container{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px; }
  @media (max-width:520px){ #plans-container{ grid-template-columns:1fr; } }

  .subject-card{ background:#fff; border-radius:var(--radius); padding:20px; border:1px solid #E7E5DD; position:relative; }
  .subject-card.has-test{
    border:1.5px solid #E0554F;
    box-shadow:0 0 0 4px rgba(224,85,79,0.12), 0 0 18px rgba(224,85,79,0.22);
  }
  .test-badge{
    position:absolute; top:-10px; left:14px; background:#E0554F; color:#fff; font-size:11px; font-weight:700;
    padding:4px 12px; border-radius:20px; display:flex; align-items:center; gap:4px;
    box-shadow:0 2px 6px rgba(224,85,79,0.4);
  }
  .subject-card .head{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .subject-card .head .icon-wrap{
    width:38px; height:38px; border-radius:10px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .subject-card h3{ font-size:16px; }
  .subject-card .row{ display:flex; gap:10px; margin-bottom:10px; font-size:13.5px; line-height:1.6; align-items:flex-start; }
  .subject-card .row:last-child{ margin-bottom:0; }
  .subject-card .row .row-icon{ flex-shrink:0; margin-top:2px; }
  .subject-card .row b{ color:var(--ink); font-weight:600; }
  .subject-card .row span.txt{ color:var(--ink); }

  .empty-state{ grid-column:1 / -1; text-align:center; padding:50px 20px; color:var(--slate); background:#fff; border-radius:var(--radius); border:1px solid #E7E5DD; }
  .empty-state svg{ color:#D8D5C8; margin-bottom:10px; }

  .admin-note{
    display:flex; align-items:flex-start; gap:12px; background:var(--gold-light,#FDEEE3); border:1px solid #F0C9A6;
    border-radius:14px; padding:16px 18px; margin-bottom:16px;
  }
  .admin-note .ic{ color:#C56A2E; flex-shrink:0; margin-top:2px; }
  .admin-note h4{ font-size:14px; color:#8A4A1F; margin-bottom:4px; }
  .admin-note p{ font-size:13.5px; color:var(--ink); margin:0; line-height:1.7; }
</style>
</head>

    <div class="txt">
      <h1>خطة الأسبوع الدراسية</h1>
      <p>مدرسة المروج - صفحة أولياء الأمور</p>
    </div>
  </div>

  <div class="grade-tabs" id="grade-tabs">
    <button class="grade-tab active" data-grade="first_intermediate">أول متوسط</button>
    <button class="grade-tab" data-grade="second_intermediate">ثاني متوسط</button>
    <button class="grade-tab" data-grade="third_intermediate">ثالث متوسط</button>
  </div>

  <div class="week-nav">
    <button id="week-prev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg> السابق</button>
    <div class="center"><div class="label" id="week-label">الأسبوع 2</div><div class="sub">اختر الأسبوع للاستعراض</div></div>
    <button id="week-next">التالي <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>

  <div id="admin-note-container"></div>
  <div id="plans-container"></div>
</div>

<script>
const SUPABASE_URL = 'https://sovfrlvcvcyjcyauurpl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_jWUr3tDZL-Bg_Qjr-iH5bg_xSEipTmA';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentWeek = 2;
let currentGrade = 'first_intermediate';

const subjectIcons = {
  'الرياضيات': '<path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h5M8 17h3"/>',
  'العلوم': '<path d="M9 3v6l-5 9a2 2 0 002 3h12a2 2 0 002-3l-5-9V3"/><path d="M9 3h6"/>',
  'اللغة العربية': '<path d="M4 19V6a2 2 0 012-2h8l6 6v9a2 2 0 01-2 2H6a2 2 0 01-2-2z"/><path d="M8 12h8M8 16h5"/>',
  'اللغة الإنجليزية': '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 2.5 15.5 0 18M12 3c-2.5 2.5-2.5 15.5 0 18"/>',
  'التربية الإسلامية': '<path d="M12 3a9 9 0 109 9 7 7 0 01-9-9z"/>',
  'الحاسب الآلي': '<rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/>',
  'الدراسات الاجتماعية': '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18 14 14 0 010-18z"/>',
  'التربية الفنية': '<path d="M12 3a9 9 0 000 18c1.5 0 2-1 2-2s-.5-1.5-.5-2 1-1 2-1a3 3 0 003-3 7 7 0 00-6.5-10z"/><circle cx="8" cy="10" r="1"/><circle cx="12" cy="8" r="1"/><circle cx="16" cy="10" r="1"/>',
  'التربية البدنية': '<circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18M6 6l12 12M18 6L6 18"/>',
};
const defaultIcon = '<path d="M4 4h13l3 3v13H4z"/><path d="M8 10h8M8 14h6"/>';

const accentCycle = [
  { bg:'var(--navy-light)',  fg:'var(--navy)'   },
  { bg:'var(--purple-light)',fg:'var(--purple)' },
  { bg:'var(--teal-light)',  fg:'var(--teal)'   },
  { bg:'var(--green-light)', fg:'var(--green)'  },
];
const rowIconColors = ['var(--teal)', 'var(--purple)', 'var(--navy)'];

document.getElementById('grade-tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.grade-tab');
  if (!btn) return;
  document.querySelectorAll('.grade-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentGrade = btn.dataset.grade;
  loadPlans();
});

document.getElementById('week-prev').addEventListener('click', () => { if (currentWeek > 2) { currentWeek--; loadPlans(); } });
document.getElementById('week-next').addEventListener('click', () => { if (currentWeek < 40) { currentWeek++; loadPlans(); } });

async function loadPlans() {
  document.getElementById('week-label').textContent = 'الأسبوع ' + currentWeek;

  const { data: noteData } = await sb.from('weekly_admin_notes')
    .select('note').eq('grade_level', currentGrade).eq('week_number', currentWeek).maybeSingle();

  const noteContainer = document.getElementById('admin-note-container');
  if (noteData && noteData.note) {
    noteContainer.innerHTML = `
      <div class="admin-note">
        <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        <div><h4>ملاحظة الإدارة</h4><p>${noteData.note}</p></div>
      </div>`;
  } else {
    noteContainer.innerHTML = '';
  }

  const { data: plans, error } = await sb.from('weekly_plans')
    .select('lessons, performance_tasks, homework, has_test, subjects(name)')
    .eq('grade_level', currentGrade).eq('week_number', currentWeek);

  const container = document.getElementById('plans-container');
  container.innerHTML = '';

  if (error) {
    container.innerHTML = `<div class="empty-state">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
      <p>تعذر تحميل الخطة حاليًا. حاول لاحقًا.</p></div>`;
    return;
  }

  if (!plans || plans.length === 0) {
    container.innerHTML = `<div class="empty-state">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18"/></svg>
      <p>لا توجد خطة مُدخلة لهذا الأسبوع بعد</p></div>`;
    return;
  }

  plans.forEach((p, idx) => {
    const subjectName = p.subjects ? p.subjects.name : '';
    const iconPath = subjectIcons[subjectName] || defaultIcon;
    const accent = accentCycle[idx % accentCycle.length];
    const lessonsList = (p.lessons && p.lessons.length > 0) ? p.lessons : [];
    const lessonsHtml = lessonsList.length > 1
      ? '<ul style="margin:2px 0 0; padding-right:16px;">' + lessonsList.map(l => `<li class="txt">${l}</li>`).join('') + '</ul>'
      : `<span class="txt">${lessonsList[0] || '-'}</span>`;
    const card = document.createElement('div');
    card.className = 'subject-card' + (p.has_test ? ' has-test' : '');
    const testBadgeHtml = p.has_test ? `<div class="test-badge">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.7 3.86a2 2 0 00-3.4 0z"/></svg>
      يوجد اختبار</div>` : '';
    card.innerHTML = `
      ${testBadgeHtml}
      <div class="head">
        <div class="icon-wrap" style="background:${accent.bg}; color:${accent.fg};"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${iconPath}</svg></div>
        <h3>${subjectName}</h3>
      </div>
      <div class="row">
        <svg class="row-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${rowIconColors[0]}" stroke-width="2"><path d="M4 19.5V6a2 2 0 012-2h13v15H6a2 2 0 00-2 2z"/><path d="M19 19a2 2 0 01-2 2H6a2 2 0 002 2h13v-2"/></svg>
        <div><b>الدرس: </b>${lessonsHtml}</div>
      </div>
      <div class="row">
        <svg class="row-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${rowIconColors[1]}" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        <div><b>المهام الأدائية: </b><span class="txt">${p.performance_tasks || '-'}</span></div>
      </div>
      <div class="row">
        <svg class="row-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${rowIconColors[2]}" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 2v4M16 2v4M4 10h16"/></svg>
        <div><b>الواجبات: </b><span class="txt">${p.homework || '-'}</span></div>
      </div>`;
    container.appendChild(card);
  });
}

loadPlans();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
